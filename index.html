
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tusti AI - Personal Companion</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  color: white;
  background:
    radial-gradient(circle at 20% 20%, #153b79 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, #30105f 0%, transparent 40%),
    linear-gradient(145deg, #030817, #07152e, #100b29);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.app {
  width: 100%;
  max-width: 450px;
  height: 90vh;
  min-height: 520px;
  max-height: 850px;
  border: 1px solid rgba(100,180,255,.3);
  border-radius: 25px;
  background: rgba(8,20,45,.85);
  box-shadow: 0 0 40px rgba(0,140,255,.2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  padding: 22px;
  text-align: center;
  border-bottom: 1px solid rgba(100,180,255,.2);
}

.logo {
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 5px;
  color: #75caff;
  text-shadow: 0 0 20px #168bff;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 2px;
  color: #9bb9e8;
  margin-top: 7px;
}

.status {
  margin-top: 12px;
  font-size: 12px;
  color: #76e8c0;
}

.welcome {
  text-align: center;
  padding: 35px 15px 20px;
}

.avatar {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  margin: auto auto 18px;
  display: grid;
  place-items: center;
  font-size: 38px;
  background: linear-gradient(135deg,#155eaa,#7139bd);
  box-shadow: 0 0 30px #167bdb;
}

.welcome h2 {
  color: #8bd2ff;
  margin-bottom: 10px;
}

.welcome p {
  color: #a9b9d5;
  font-size: 13px;
  line-height: 1.6;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.message {
  padding: 12px 15px;
  border-radius: 17px;
  max-width: 85%;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.bot {
  align-self: flex-start;
  background: #142c50;
  border: 1px solid #24588a;
}

.user {
  align-self: flex-end;
  background: linear-gradient(135deg,#1768bd,#583ab4);
}

.input-area {
  display: flex;
  gap: 9px;
  padding: 15px;
  border-top: 1px solid rgba(100,180,255,.2);
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 25px;
  border: 1px solid #28558b;
  outline: none;
  background: #0c1c38;
  color: white;
  font-size: 14px;
}

button {
  width: 48px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg,#159bff,#7045d5);
  color: white;
  font-size: 20px;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 9px;
  font-size: 10px;
  color: #7189ad;
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">TUSTI</div>
  <div class="subtitle">YOUR PERSONAL AI COMPANION</div>
  <div class="status">● ONLINE INTERFACE</div>
</header>

<section class="welcome">
  <div class="avatar">✦</div>
  <h2>Hello! I'm Tusti 💙</h2>
  <p>Your personal AI companion.<br>
  I'm here whenever you need someone to talk to.</p>
</section>

<div id="chat">
  <div class="message bot">
    Hello! I'm Tusti. 💙<br>
    It's lovely to meet you! What's on your mind?
  </div>
</div>

<div class="input-area">
  <input id="userInput" type="text"
    placeholder="Message Tusti..."
    autocomplete="off">
  <button onclick="sendMessage()">➤</button>
</div>

<footer>
  FIRST WORKING INTERFACE · AI CONNECTION COMING NEXT
</footer>

</div>

<script>

const WORKER_URL = "https://tusti-ai.kr073197.workers.dev";

async function sendMessage() {
  const input = document.getElementById("userInput");
  const chat = document.getElementById("chat");
  const message = input.value.trim();

  if (!message) return;

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = message;
  chat.appendChild(userMessage);

  input.value = "";

  const reply = document.createElement("div");
  reply.className = "message bot";
  reply.textContent = "Tusti is thinking... 💙";
  chat.appendChild(reply);

  chat.scrollTop = chat.scrollHeight;

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Connection failed");
    }

    reply.textContent = data.reply || "Please try again.";
  } catch (error) {
  reply.textContent = "Error: " + error.message;
  console.error(error);
  }

  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("userInput")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });
  
</script>

</body>
</html>
